<style>

    color: #ecf0f1;

  }

    <!-- دکمه‌ی باز و بسته شدن Navbar در موبایل -->

        <!-- 📞 دکمه تماس -->

          <ul class="navbar-nav">
            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle text-white" href="#" role="button" data-bs-toggle="dropdown">{{ request.user.full_name }}</a>

              <ul class="dropdown-menu dropdown-menu-end">
                <li>

                <li>

                </li>

                <li>
                  <a class="dropdown-item" href="">تغییر رمز عبور</a>
                </li>

                <li>
                  <a class="dropdown-item text-danger" href="">خروج</a>

              </ul>

          </ul>
        {% else %}
